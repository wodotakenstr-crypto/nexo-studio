<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="800" viewBox="0 0 2400 800" role="img" aria-labelledby="title desc">
  <title id="title">NEXO Studio</title>
  <desc id="desc">Logo de NEXO Studio con tres barras ascendentes y acento naranja.</desc>
  <rect width="2400" height="800" fill="#f4f2eb"/>
  <g transform="translate(220 215) skewY(-28)" fill="#111d35">
    <rect x="0" y="115" width="76" height="150" rx="5"/>
    <rect x="110" y="55" width="76" height="210" rx="5"/>
    <rect x="220" y="0" width="76" height="265" rx="5"/>
  </g>
  <text x="590" y="510" fill="#111d35" font-family="Arial, Helvetica, sans-serif" font-size="250" font-weight="800" letter-spacing="-14">NEXO</text>
  <text x="1370" y="510" fill="#ff724f" font-family="Arial, Helvetica, sans-serif" font-size="250" font-weight="800">/</text>
  <text x="590" y="610" fill="#68706c" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="600" letter-spacing="12">STUDIO</text>
